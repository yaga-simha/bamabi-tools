[package]
name = "bamabi_build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Safe (`#![forbid(unsafe_code)]`), zero-Bevy guest mod compiler discovery, build, staging, signing, `.bampack` packaging, SDK export, and `notify` watcher library for `bamabi`"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
keygen = ["bamabi_trust/keygen"]

[dependencies]
bamabi_sys = { workspace = true }
bamabi_manifest = { workspace = true }
bamabi_sdk_gen = { workspace = true }
bamabi_trust = { workspace = true }
notify = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
bamabi_trust = { workspace = true, features = ["keygen"] }
tempfile = { workspace = true }
