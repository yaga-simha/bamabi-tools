name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-and-tests:
    name: Quality & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Formatting, forbid(unsafe_code), zero-Bevy, clippy & rustdoc
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VCToolsInstallDir:-}" ] && command -v cygpath >/dev/null 2>&1; then
            MSVC_BIN="$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")"
            if [ -x "${MSVC_BIN}/link.exe" ]; then
              export PATH="${MSVC_BIN}:${PATH}"
            fi
          fi
          cargo fmt --all -- --check
          for crate_root in \
            crates/bamabi_trust/src/lib.rs \
            crates/bamabi_manifest/src/lib.rs \
            crates/cargo-bam/src/lib.rs \
            crates/cargo-bam/src/main.rs; do
            if ! grep -q '#!\[forbid(unsafe_code)\]' "$crate_root"; then
              echo "ERROR: $crate_root is missing required #![forbid(unsafe_code)] declaration!"
              exit 1
            fi
          done
          if cargo tree --workspace | sed 's/ (.*//' | grep -v bamabi | grep -i bevy; then
            echo "ERROR: Unexpected Bevy dependency found in bamabi-tools!"
            exit 1
          fi
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

      - name: Run Layer 1 test suites, doctor & SDK header export
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          if [ -n "${VCToolsInstallDir:-}" ] && command -v cygpath >/dev/null 2>&1; then
            MSVC_BIN="$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")"
            if [ -x "${MSVC_BIN}/link.exe" ]; then
              export PATH="${MSVC_BIN}:${PATH}"
            fi
          fi
          cargo test -p bamabi_trust --no-default-features
          cargo test --workspace --all-features
          cargo test --doc --all-features
          cargo run -p cargo-bam -- doctor --require-c
          rm -rf target/ci_sdk_check
          cargo run -p cargo-bam -- header --out target/ci_sdk_check
          test -f target/ci_sdk_check/bamabi.h
          test -f target/ci_sdk_check/bamabi.hpp
          test -f target/ci_sdk_check/bamabi.zig

  audit:
    name: Typos & Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Spellcheck repository (`typos`)
        uses: crate-ci/typos@v1.31.1

      - name: Install `cargo-deny`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Audit advisories, licenses, bans & sources (`cargo-deny`)
        run: cargo deny --all-features check advisories licenses bans sources
